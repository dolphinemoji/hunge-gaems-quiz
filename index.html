<!doctype html>
<html lang="en">
<head>

<title>Hunge Gaems: Who in the hell are you in the arena?</title>
<style>
  @font-face { font-family: "Gotham"; src: url("fonts/Gotham-Book.otf") format("opentype"); font-weight: 400; }
  @font-face { font-family: "Gotham"; src: url("fonts/Gotham-Medium.otf") format("opentype"); font-weight: 500; }
  @font-face { font-family: "Gotham"; src: url("fonts/Gotham-Bold.otf") format("opentype"); font-weight: 700; }
  :root { --bg: #0b0b0b; --text: #f2f2f2; --muted: #8f8f8f; --line: #2c2c2c; --gold: #e3c15b; --alt: #d46273;
          --sans: "Gotham", "Montserrat", "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 40px; }
  .brand { font: 700 18px/1 var(--sans); letter-spacing: .02em; }
  .brand span { color: var(--gold); margin-left: 5px; }
  .progress { color: var(--muted); font-size: 13px; }
  .bar { height: 3px; background: #222; margin: -28px 0 36px; }
  .bar i { display: block; height: 100%; background: var(--text); transition: width .25s; }
  h1 { font: 500 26px/1.25 var(--sans); margin: 0 0 12px; }
  h2 { font: 500 20px/1.35 var(--sans); margin: 0 0 24px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  input, select { font: 15px var(--sans); color: var(--text); background: #111; border: 1px solid #3a3a3a; padding: 9px 11px; border-radius: 0; }
  input:focus, select:focus { outline: none; border-color: var(--gold); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: 500 15px var(--sans); color: var(--text); background: transparent; border: 1px solid #3a3a3a; padding: 10px 18px; cursor: pointer; border-radius: 0; }
  button:hover { background: #1b1b1b; border-color: #555; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); border-color: var(--gold); color: #0b0b0b; font-weight: 700; }
  button.primary:hover { background: #ecd07a; }
  .answers { display: flex; flex-direction: column; gap: 8px; }
  .answers button { text-align: left; padding: 14px 16px; font-weight: 400; line-height: 1.4; }
  .answers button:hover { border-color: var(--text); }
  .nav { display: flex; justify-content: space-between; margin-top: 24px; }
  .ghost { border-color: transparent; color: var(--muted); padding-left: 0; }
  .ghost:hover { background: none; color: var(--text); border-color: transparent; }
  .traits { display: flex; flex-direction: column; gap: 14px; margin: 24px 0 28px; }
  .trait b { font-weight: 500; }
  .trait p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .arche { margin: 0 0 28px; }
  .arche b { color: var(--gold); font-weight: 500; }
  .arche p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .out { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .out code { flex: 1; font: 13px/1.5 var(--mono); background: #111; border: 1px solid #2a2a2a; padding: 10px 12px; overflow-x: auto; white-space: pre; }
  .people { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
  .people textarea { width: 100%; min-height: 90px; font: 13px/1.5 var(--mono); color: var(--text); background: #111; border: 1px solid #2a2a2a; padding: 10px 12px; resize: vertical; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.5em; }
</style>
</head>

<script>
/* Hunge Gaems personality quiz. Data comes from the app (/api/quiz) or, in the
   standalone export, from the EMBED block below. Answers never name traits: each
   one quietly adds weight to several, and the result is 3-5 core traits as a
   roster line the Tribute builder reads directly. */
const EMBED = {"quiz": {"min_traits": 3, "max_traits": 5, "keep_ratio": 0.72, "kin_damp": 0.7, "kin": [["cautious", "pessimistic", "patient"], ["charismatic", "talkative", "showoff"], ["playful", "witty", "mischievous"], ["calm", "stoic", "easygoing"], ["strategic", "meticulous", "disciplined"], ["curious", "observant"], ["reckless", "impulsive"], ["compassionate", "empathetic", "forgiving"], ["proud", "self_assured", "competitive"], ["resourceful", "inventive", "pragmatic"], ["imaginative", "eccentric"], ["protective", "loyal"]], "questions": [{"q": "Ok, your group is running low on supplies, and you've spotted another tribute with plenty to spare. What do you do?", "answers": [{"a": "See if they're willing to trade.", "w": {"charismatic": 2, "diplomatic": 1, "empathetic": 1}}, {"a": "Wait until they leave and take some.", "w": {"opportunistic": 2, "ruthless": 1, "mischievous": 1}}, {"a": "Pool together what we've got and make it work.", "w": {"loyal": 1, "strategic": 1, "diplomatic": 1, "pragmatic": 1}}, {"a": "Go look for supplies myself.", "w": {"lone_wolf": 2, "resourceful": 1, "inventive": 1}}]}, {"q": "The gong goes off. The Cornucopia is right there. Waht's the move?", "answers": [{"a": "Sprint for the biggest bag. It's mine now", "w": {"competitive": 2, "fearless": 1, "ambitious": 1, "reckless": 1}}, {"a": "Grab whatever's closest and get the hell out", "w": {"cautious": 2, "pragmatic": 1, "observant": 1}}, {"a": "Find a buddy. Right now. Anyone", "w": {"loyal": 1, "protective": 1, "talkative": 1}}, {"a": "Hang back and watch who runs where", "w": {"observant": 2, "strategic": 1, "calm": 1, "patient": 1}}]}, {"q": "You've made it through your first day in the arena. It's dark out and you're by yourself. How are you spending the night?", "answers": [{"a": "Humming or talking to myself to pass the time.", "w": {"playful": 1, "optimistic": 1, "talkative": 1, "eccentric": 1}}, {"a": "Trying to sleep, but every little noise is keeping me up.", "w": {"pessimistic": 1, "superstitious": 1, "cautious": 1}}, {"a": "Getting some much needed sleep.", "w": {"easygoing": 2, "calm": 1, "stoic": 1}}, {"a": "Figuring out what I need to do in the morning.", "w": {"disciplined": 2, "meticulous": 1, "strategic": 1}}]}, {"q": "One of your allies makes a pretty stupid mistake and nearly gets the two of you killed. How do you handle it?", "answers": [{"a": "It's fine, shit happens. We're still alive.", "w": {"forgiving": 2, "easygoing": 1, "loyal": 1}}, {"a": "Keep it to myself, but I'm keeping that in mind moving forward.", "w": {"guarded": 1, "stubborn": 1, "patient": 1}}, {"a": "Let them know exactly what they did wrong.", "w": {"cantankerous": 2, "proud": 1, "self_assured": 1}}, {"a": "Make a joke about it and move on.", "w": {"witty": 2, "playful": 1, "diplomatic": 1}}]}, {"q": "You've stumbled across a peculiar little plant. It's glowing for whatever reason, and you have no idea what it is. Whatcha doing?", "answers": [{"a": "Well, naturally, I'm going to touch it.", "w": {"reckless": 2, "curious": 1, "impulsive": 1}}, {"a": "Take a closer look. Might be useful later.", "w": {"observant": 1, "meticulous": 1, "curious": 1}}, {"a": "Congratulations to me on discovering a new species.", "w": {"eccentric": 1, "imaginative": 1, "playful": 1}}, {"a": "I don't particularly trust plants that produce their own lighting.", "w": {"cautious": 1, "pessimistic": 1, "superstitious": 1}}]}, {"q": "You've received a gift from a sponsor, along with a little note asking you to share it with the other tributes. How are you handling that?", "answers": [{"a": "Split it with the people I'm teamed up with.", "w": {"compassionate": 2, "loyal": 1}}, {"a": "I'm willing to share, but I'd like something in return.", "w": {"manipulative": 1, "strategic": 1, "opportunistic": 1}}, {"a": "It was sent to me. I'm keeping it.", "w": {"stubborn": 1, "self_assured": 1, "ruthless": 1, "proud": 1}}, {"a": "Give some to whoever needs it most, regardless of whose side they're on.", "w": {"empathetic": 1, "compassionate": 1, "sentimental": 1}}]}, {"q": "There's a camera pointed at you. You've got approximately fifteen seconds of fame before somebody more interesting comes along. Go.", "answers": [{"a": "Give the folks watching at home a little show.", "w": {"showoff": 2, "charismatic": 1}}, {"a": "They can watch my ass as I walk away.", "w": {"stoic": 1, "guarded": 1, "self_assured": 1}}, {"a": "Shake my ass for recreational purposes.", "w": {"mischievous": 1, "witty": 1, "playful": 1}}, {"a": "Shake my ass for financial purposes.", "w": {"ambitious": 2, "opportunistic": 1}}]}, {"q": "Your plan falls apart halfway through. Now what?", "answers": [{"a": "Work with what I've got and figure it out as I go.", "w": {"adaptable": 2, "inventive": 1, "impulsive": 1}}, {"a": "Go back to step one and figure out where I went wrong.", "w": {"disciplined": 1, "meticulous": 1, "stubborn": 1, "patient": 1}}, {"a": "Get a little frustrated, then get to work fixing it.", "w": {"cantankerous": 1, "resilient": 1, "pragmatic": 1}}, {"a": "I didn't have much of a plan to begin with.", "w": {"easygoing": 1, "impulsive": 1, "restless": 1}}]}, {"q": "You hear another tribute calling for help. They're hurt, and you've had no prior interaction with them. What do you do?", "answers": [{"a": "Go over and help them without a second thought.", "w": {"protective": 2, "compassionate": 1, "fearless": 1}}, {"a": "Take a look around, make sure it's safe, then help.", "w": {"cautious": 1, "empathetic": 1, "observant": 1}}, {"a": "Keep moving. I've got my own problems to worry about.", "w": {"pragmatic": 2, "ruthless": 1}}, {"a": "Help them out. Having someone owe me a favor could come in handy.", "w": {"opportunistic": 1, "manipulative": 1, "diplomatic": 1}}]}, {"q": "You've spent the last few hours hiding in the same spot, with very little to do. How are you holding up?", "answers": [{"a": "I'm perfectly fine sitting here for a few more hours.", "w": {"patient": 2, "calm": 1, "stoic": 1}}, {"a": "I'm getting restless. I need to get up and do something.", "w": {"restless": 2, "impulsive": 1}}, {"a": "Keeping myself entertained with whatever comes to mind.", "w": {"imaginative": 2, "eccentric": 1}}, {"a": "Keeping busy by sorting through and organizing my supplies.", "w": {"meticulous": 1, "restless": 1, "disciplined": 1}}]}, {"q": "For whatever reason, another tribute has decided they're better at climbing trees than you. Are we entertaining this?", "answers": [{"a": "Well, now I've got to prove them wrong.", "w": {"competitive": 2, "reckless": 1, "showoff": 1}}, {"a": "Alright, give me a second to stretch.", "w": {"competitive": 1, "disciplined": 1, "self_assured": 1}}, {"a": "They're more than welcome to climb that tree by themselves.", "w": {"pragmatic": 1, "calm": 1}}, {"a": "Sure, let's get a little creative with the rules.", "w": {"mischievous": 2, "opportunistic": 1}}]}, {"q": "You're allowed to bring one little good luck charm into the arena. What are you bringing?", "answers": [{"a": "Something sentimental that reminds me of home.", "w": {"sentimental": 2, "superstitious": 1}}, {"a": "Nothing. I'd rather rely on myself and a good plan.", "w": {"strategic": 1, "self_assured": 1, "proud": 1}}, {"a": "Some interesting little trinket I've picked up over the years.", "w": {"resourceful": 1, "eccentric": 1, "curious": 1}}, {"a": "I like to think I'm lucky enough on my own.", "w": {"optimistic": 1, "proud": 1, "showoff": 1}}]}, {"q": "Your group is having a disagreement about what to do next, and nobody seems willing to budge. How do you handle it?", "answers": [{"a": "Talk through everybody's ideas and find something we can agree on.", "w": {"diplomatic": 2, "calm": 1}}, {"a": "Make an executive decision so we can get moving.", "w": {"ambitious": 1, "self_assured": 1, "proud": 1}}, {"a": "Try to get everybody on board with my idea.", "w": {"manipulative": 2, "strategic": 1}}, {"a": "Let them figure it out. I'll do my own thing.", "w": {"lone_wolf": 2, "stubborn": 1}}]}, {"q": "You haven't had anything to eat since yesterday, and you've just come across a beehive. What are you doing?", "answers": [{"a": "I'm hungry enough to risk a few bee stings.", "w": {"fearless": 2, "reckless": 1, "resilient": 1}}, {"a": "Figure out a way to get the honey without getting stung.", "w": {"inventive": 1, "meticulous": 1, "resourceful": 1}}, {"a": "Take a look around and see if there's an easier source of food nearby.", "w": {"observant": 1, "patient": 1, "pragmatic": 1}}, {"a": "Leave it alone. I'm sure I'll find something else.", "w": {"optimistic": 1, "easygoing": 1, "adaptable": 1}}]}, {"q": "You stumble across a sleeping tribute who had previously betrayed you. You've got the upper hand this time. What do you do?", "answers": [{"a": "Leave them alone. What's done is done.", "w": {"forgiving": 2, "compassionate": 1}}, {"a": "Take their supplies and be on my way.", "w": {"opportunistic": 1, "ruthless": 1, "mischievous": 1}}, {"a": "Kill them while I've got the opportunity.", "w": {"ruthless": 2, "stoic": 1}}, {"a": "Wake them up and have a conversation about what happened.", "w": {"proud": 1, "stubborn": 1, "cantankerous": 1}}]}, {"q": "It's been an absolute disaster of a day in the arena, and somehow it keeps getting worse. How are we doing?", "answers": [{"a": "Well, I've made it this far. Might as well keep going.", "w": {"resilient": 2, "stubborn": 1}}, {"a": "At this point, it's actually kind of funny.", "w": {"witty": 1, "playful": 1, "optimistic": 1}}, {"a": "I'd like everybody to know that I saw this coming.", "w": {"pessimistic": 2, "stoic": 1}}, {"a": "Thinking about the folks back home. I've got some stories to tell them.", "w": {"sentimental": 2, "loyal": 1}}]}, {"q": "You've somehow managed to get a little free time in the legally distinct Hunge Gaems. How are you spending your afternoon?", "answers": [{"a": "Go see what neat little things I can find around here.", "w": {"curious": 2, "restless": 1}}, {"a": "Find somebody who's willing to entertain a conversation.", "w": {"talkative": 2, "charismatic": 1}}, {"a": "Get my shit in order while I've got the time.", "w": {"disciplined": 1, "pragmatic": 1, "strategic": 1}}, {"a": "Lie in the grass and let my mind wander a bit. It's actually quite nice out.", "w": {"imaginative": 1, "easygoing": 1, "superstitious": 1}}]}, {"q": "If I were to ask your friends to describe you, what do you think they'd say?", "answers": [{"a": "The designated adult in a group of unsupervised adults.", "w": {"loyal": 1, "protective": 1, "diplomatic": 1}}, {"a": "An absolute fucking goober.", "w": {"showoff": 1, "eccentric": 1, "talkative": 1}}, {"a": "A pain in the ass, but a damn good friend.", "w": {"cantankerous": 1, "protective": 1, "guarded": 1}}, {"a": "Nobody knows what I'm doing, but I'm definitely doing something.", "w": {"mischievous": 1, "inventive": 1, "curious": 1}}]}]}, "traits": {"charismatic": {"label": "Charismatic", "desc": "Gets along with people pretty easily and knows how to get them on board.", "category": "Social personality"}, "lone_wolf": {"label": "Lone Wolf", "desc": "Would rather do their own thing. Works well alone.", "category": "Social personality"}, "loyal": {"label": "Loyal", "desc": "Sticks with their people, even when it gets inconvenient.", "category": "Social personality"}, "manipulative": {"label": "Manipulative", "desc": "Knows how to get people to do what they want, one way or another.", "category": "Social personality"}, "empathetic": {"label": "Empathetic", "desc": "Pretty good at picking up on how other people feel and what they need.", "category": "Social personality"}, "guarded": {"label": "Guarded", "desc": "Takes a while to warm up to people. Keeps a lot to themselves.", "category": "Social personality"}, "strategic": {"label": "Strategic", "desc": "Likes to think a few steps ahead before doing anything.", "category": "Decision-making"}, "impulsive": {"label": "Impulsive", "desc": "Does whatever feels right in the moment. The thinking comes later.", "category": "Decision-making"}, "opportunistic": {"label": "Opportunistic", "desc": "Pretty good at spotting an opportunity and making the most of it.", "category": "Decision-making"}, "cautious": {"label": "Cautious", "desc": "Likes to know what they're getting into before getting into it.", "category": "Decision-making"}, "curious": {"label": "Curious", "desc": "Wants to know what something is, how it works, and what's on the other side of it.", "category": "Decision-making"}, "adaptable": {"label": "Adaptable", "desc": "Pretty good at rolling with it when things don't go according to plan.", "category": "Decision-making"}, "fearless": {"label": "Fearless", "desc": "Willing to get involved in things that would scare most people off.", "category": "Conflict and survival"}, "resourceful": {"label": "Resourceful", "desc": "Can make something useful out of just about anything they've got on hand.", "category": "Conflict and survival"}, "ruthless": {"label": "Ruthless", "desc": "Willing to make some fairly nasty decisions to get what they want.", "category": "Conflict and survival"}, "protective": {"label": "Protective", "desc": "Looks out for their people and takes their safety pretty seriously.", "category": "Conflict and survival"}, "resilient": {"label": "Resilient", "desc": "Gets knocked down, gets back up, and gets on with it.", "category": "Conflict and survival"}, "reckless": {"label": "Reckless", "desc": "Has a fairly loose definition of an acceptable risk.", "category": "Conflict and survival"}, "optimistic": {"label": "Optimistic", "desc": "Usually figures things will work out somehow.", "category": "Personal disposition"}, "pessimistic": {"label": "Pessimistic", "desc": "Usually figures things will go wrong, and plans accordingly.", "category": "Personal disposition"}, "ambitious": {"label": "Ambitious", "desc": "Has big plans for themselves and wants to see them through.", "category": "Personal disposition"}, "stubborn": {"label": "Stubborn", "desc": "Good luck talking them out of something once they've made up their mind.", "category": "Personal disposition"}, "compassionate": {"label": "Compassionate", "desc": "Genuinely cares about people and wants to help where they can.", "category": "Personal disposition"}, "proud": {"label": "Proud", "desc": "Takes a lot of pride in who they are and doesn't like looking foolish.", "category": "Personal disposition"}, "observant": {"label": "Observant", "desc": "Picks up on little details that most people wouldn't think twice about.", "category": "Decision-making"}, "patient": {"label": "Patient", "desc": "Perfectly willing to sit around and wait for the right moment.", "category": "Decision-making"}, "disciplined": {"label": "Disciplined", "desc": "Gets things done, sticks to a routine, and follows through.", "category": "Decision-making"}, "meticulous": {"label": "Meticulous", "desc": "Likes things done properly. Will happily spend a little extra time getting the details right.", "category": "Decision-making"}, "pragmatic": {"label": "Pragmatic", "desc": "Concerned with what actually works. Good enough is good enough sometimes.", "category": "Decision-making"}, "inventive": {"label": "Inventive", "desc": "Likes figuring out weird little ways to solve problems with whatever they've got.", "category": "Decision-making"}, "diplomatic": {"label": "Diplomatic", "desc": "Pretty good at getting people to settle down and work something out.", "category": "Social personality"}, "forgiving": {"label": "Forgiving", "desc": "Has a hard time staying mad at people. Always willing to give it another go.", "category": "Social personality"}, "talkative": {"label": "Talkative", "desc": "Likes to talk. About what? Just about anything.", "category": "Social personality"}, "sentimental": {"label": "Sentimental", "desc": "Gets attached to people, places, and seemingly insignificant little things.", "category": "Social personality"}, "playful": {"label": "Playful", "desc": "Likes to have a little fun with things, even when the circumstances aren't ideal.", "category": "Personal disposition"}, "witty": {"label": "Witty", "desc": "Quick with a joke, and usually has something to say at just the right moment.", "category": "Personal disposition"}, "eccentric": {"label": "Eccentric", "desc": "A little odd, in their own very particular way.", "category": "Personal disposition"}, "imaginative": {"label": "Imaginative", "desc": "Has a whole lot going on in their head, and an idea for just about everything.", "category": "Personal disposition"}, "easygoing": {"label": "Easygoing", "desc": "Pretty content to go along with whatever's happening.", "category": "Personal disposition"}, "cantankerous": {"label": "Cantankerous", "desc": "Has something to complain about at any given moment. Can be surprisingly sweet about it.", "category": "Personal disposition"}, "stoic": {"label": "Stoic", "desc": "Keeps their feelings to themselves and gets on with things.", "category": "Personal disposition"}, "calm": {"label": "Calm", "desc": "Keeps a level head, even when everybody else is losing theirs.", "category": "Personal disposition"}, "competitive": {"label": "Competitive", "desc": "Can turn just about anything into a competition. Really doesn't like losing.", "category": "Personal disposition"}, "showoff": {"label": "Showoff", "desc": "Likes having an audience. If they're going to do something, somebody better be watching.", "category": "Social personality"}, "mischievous": {"label": "Mischievous", "desc": "Likes stirring the pot a little, mostly for their own amusement.", "category": "Social personality"}, "superstitious": {"label": "Superstitious", "desc": "Has a few little rituals and isn't about to find out what happens if they stop doing them.", "category": "Personal disposition"}, "restless": {"label": "Restless", "desc": "Always needs something to do or somewhere to go.", "category": "Personal disposition"}, "self_assured": {"label": "Self-Assured", "desc": "Pretty comfortable with themselves and their own judgment.", "category": "Personal disposition"}}, "archetypes": {"benevolent_manipulator": {"label": "The Benevolent Manipulator", "desc": "Really does care about you. Also knows exactly what to say to get you to do something for them.", "traits": ["empathetic", "manipulative", "strategic"]}, "cowardly_hero": {"label": "The Cowardly Hero", "desc": "Scared shitless, but if one of their friends needs help, they're going in anyway.", "traits": ["protective", "cautious", "loyal"]}, "charming_opportunist": {"label": "The Charming Opportunist", "desc": "Makes friends pretty easily, and usually has a good idea of what those friends can do for them.", "traits": ["charismatic", "opportunistic", "ambitious"]}, "principled_survivor": {"label": "The Principled Survivor", "desc": "Has a few things they absolutely will not compromise on. Even if it makes this whole ordeal a lot harder.", "traits": ["resilient", "stubborn", "compassionate"]}, "smiling_executioner": {"label": "The Smiling Executioner", "desc": "Lovely person to spend an afternoon with. Absolutely capable of doing something horrible and going right back to being lovely.", "traits": ["optimistic", "ruthless", "charismatic"]}, "reluctant_warlord": {"label": "The Reluctant Warlord", "desc": "Wants to win the whole thing, but would really appreciate a version of the plan where nothing bad happens to them.", "traits": ["cautious", "ambitious", "strategic"]}, "loyal_peacock": {"label": "The Loyal Peacock", "desc": "Loves their friends, loves themselves, and would appreciate it if everybody else did too.", "traits": ["proud", "loyal", "charismatic"]}, "doomsday_prepper": {"label": "The Doomsday Prepper", "desc": "Has been waiting for this exact sort of thing to happen. Finally has a use for all that stuff in their bag.", "traits": ["pessimistic", "resourceful", "cautious"]}, "golden_retriever": {"label": "The Golden Retriever", "desc": "Happy to be here, happy to meet you, and probably a little too happy to go along with whatever you're doing.", "traits": ["optimistic", "loyal", "impulsive"]}, "lighthouse_keeper": {"label": "The Lighthouse Keeper", "desc": "Would rather be left alone, but is keeping an eye on everybody just in case somebody needs a hand.", "traits": ["lone_wolf", "protective", "guarded"]}, "chaos_gremlin": {"label": "The Chaos Gremlin", "desc": "Found something weird, messed with it, and somehow lived. Will be doing it again tomorrow.", "traits": ["impulsive", "curious", "reckless"]}, "velvet_knife": {"label": "The Velvet Knife", "desc": "Very pleasant company. I'd be a little concerned about why they're being so pleasant.", "traits": ["charismatic", "manipulative", "ruthless"]}, "accidental_saint": {"label": "The Accidental Saint", "desc": "Went out to get something for themselves and came back having done somebody a favor. Again.", "traits": ["opportunistic", "compassionate", "impulsive"]}, "iron_grandma": {"label": "The Iron Grandma", "desc": "You're getting fed, you're getting fussed at, and God help anybody who bothers you.", "traits": ["resilient", "protective", "stubborn"]}, "raccoon_monarch": {"label": "The Raccoon Monarch", "desc": "Has a bag full of little things they've found. Don't ask them to get rid of any of it. They've got plans for that stuff.", "traits": ["resourceful", "opportunistic", "curious"]}, "brooding_poet": {"label": "The Brooding Poet", "desc": "Has a lot of feelings about the state of things and would rather go sit somewhere alone and think about it.", "traits": ["pessimistic", "empathetic", "lone_wolf"]}, "cockroach": {"label": "The Cockroach", "desc": "Not particularly impressive at first glance, but somehow they're still here. Good for them.", "traits": ["resilient", "adaptable", "cautious"]}, "kamikaze_optimist": {"label": "The Kamikaze Optimist", "desc": "Absolutely convinced this is going to work. The rest of us are considerably le let D = null;                      // { quiz, traits, archetypes }
const st = { name: "", pronoun: "", district: "", i: 0, picks: [], order: [] };
let saved = [];
try { saved = JSON.parse(localStorage.getItem("hg-quiz-results") || "[]"); } catch { saved = []; }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PRON = { he: "he/him", she: "she/her", they: "they/them" };

async function load() {
  if (EMBED) { D = EMBED; return; }
  try { D = await (await fetch("/api/quiz")).json(); }
  catch { $("#app").innerHTML = `<p>Couldn't load the quiz. Open it from the running app at <code>/quiz.html</code>.</p>`; throw new Error("no data"); }
}

function shuffled(n, salt) {           // vary answer order so position doesn't hint at anything
  const a = [...Array(n).keys()];
  let s = 0; for (const ch of salt) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = n - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function intro() {
  $("#app").innerHTML = `
    <header><div class="brand">HUNGE<span>GAEMS</span></div></header>
    <h1>Who are you in the arena?</h1>
    <p class="muted">Alright, we've got ${D.quiz.questions.length} little scenarios for you. Pick whatever you'd actually do in each situation. Don't think too hard about it. It's for funsies.</p>
    <label>Your name <input id="qName" value="${esc(st.name)}" autocomplete="off"></label>
    <div class="row">
      <label>Pronouns <select id="qPron"><option value="">prefer not to say</option>${Object.entries(PRON).map(([k, v]) => `<option value="${k}" ${st.pronoun === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>District (optional) <input id="qDist" type="number" min="1" max="24" value="${esc(st.district)}"></label>
    </div>
    <button class="primary" id="qStart">Let's go</button>
    ${saved.length ? peopleHTML() : ""}`;
  $("#qStart").onclick = () => {
    st.name = $("#qName").value.trim();
    if (!st.name) { $("#qName").focus(); return; }
    st.pronoun = $("#qPron").value; st.district = $("#qDist").value.trim();
    st.i = 0; st.picks = [];
    st.order = D.quiz.questions.map((q, i) => shuffled(q.answers.length, st.name + i));
    question();
  };
  bindPeople();
}

function question() {
  const q = D.quiz.questions[st.i], n = D.quiz.questions.length;
  $("#app").innerHTML = `
    <header><div class="brand">HUNGE<span>GAEMS</span></div><div class="progress">${st.i + 1} of ${n}</div></header>
    <div class="bar"><i style="width:${(st.i / n) * 100}%"></i></div>
    <h2>${esc(q.q)}</h2>
    <div class="answers">${st.order[st.i].map((k) => `<button data-a="${k}">${esc(q.answers[k].a)}</button>`).join("")}</div>
    <div class="nav"><button class="ghost" id="qBack">${st.i ? "Back" : "Start over"}</button></div>`;
  document.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
    st.picks[st.i] = +b.dataset.a;
    if (++st.i < n) question(); else result();
  }));
  $("#qBack").onclick = () => { if (st.i) { st.i--; question(); } else intro(); };
}

function score() {
  const Q = D.quiz, raw = {}, pot = {};
  Q.questions.forEach((q, i) => {
    const best = {};
    q.answers.forEach((a) => Object.entries(a.w).forEach(([t, w]) => (best[t] = Math.max(best[t] || 0, w))));
    Object.entries(best).forEach(([t, w]) => (pot[t] = (pot[t] || 0) + w));
    const a = q.answers[st.picks[i]];
    if (a) Object.entries(a.w).forEach(([t, w]) => (raw[t] = (raw[t] || 0) + w));
  });
  const s = {};
  Object.keys(raw).forEach((t) => { if (D.traits[t]) s[t] = raw[t] / Math.sqrt(pot[t]); });
  const kinOf = {};
  (Q.kin || []).forEach((g) => g.forEach((t) => (kinOf[t] = g)));
  const chosen = [];
  let top = null;
  while (chosen.length < Q.max_traits) {
    const left = Object.keys(s).filter((t) => !chosen.includes(t));
    if (!left.length) break;
    left.sort((a, b) => s[b] - s[a] || a.localeCompare(b));
    const t = left[0];
    if (top === null) top = s[t];
    if (chosen.length >= Q.min_traits && s[t] < Q.keep_ratio * top) break;
    chosen.push(t);
    (kinOf[t] || []).forEach((k) => { if (k !== t && s[k] !== undefined) s[k] *= Q.kin_damp; });
  }
  return chosen;
}

function archetypeFor(traits) {        // same rules as the game, for one person
  const have = new Set(traits), keys = Object.keys(D.archetypes);
  const rank = (a, b) => (D.archetypes[b].traits.length - D.archetypes[a].traits.length) || (keys.indexOf(a) - keys.indexOf(b));
  const exact = keys.filter((k) => D.archetypes[k].traits.every((t) => have.has(t))).sort(rank);
  if (exact.length) return { a: D.archetypes[exact[0]], lean: false };
  const lean = keys.filter((k) => { const n = D.archetypes[k].traits; return n.length >= 3 && n.filter((t) => have.has(t)).length === n.length - 1; }).sort(rank);
  if (lean.length) return { a: D.archetypes[lean[0]], lean: true };
  const first = (k) => Math.min(...D.archetypes[k].traits.filter((t) => have.has(t)).map((t) => traits.indexOf(t)));
  const touch = keys.filter((k) => D.archetypes[k].traits.some((t) => have.has(t)))
    .sort((a, b) => first(a) - first(b) || D.archetypes[a].traits.length - D.archetypes[b].traits.length || keys.indexOf(a) - keys.indexOf(b));
  return touch.length ? { a: D.archetypes[touch[0]], touch: true } : null;
}

function rosterLine(traits) {
  const cols = [st.name, st.district || "", PRON[st.pronoun] || "", "", traits.map((t) => D.traits[t].label).join(", ")];
  return cols.join(" | ");
}

function result() {
  const traits = score(), arc = archetypeFor(traits), line = rosterLine(traits);
  saved = saved.filter((r) => r.name.toLowerCase() !== st.name.toLowerCase()).concat([{ name: st.name, line }]);
  try { localStorage.setItem("hg-quiz-results", JSON.stringify(saved)); } catch { /* private mode */ }
  $("#app").innerHTML = `
    <header><div class="brand">HUNGE<span>GAEMS</span></div><div class="progress">Done</div></header>
    <h1>${esc(st.name)}, in the arena</h1>
    <div class="traits">${traits.map((t) => `<div class="trait"><b>${esc(D.traits[t].label)}</b><p>${esc(D.traits[t].desc)}</p></div>`).join("")}</div>
    ${arc ? `<div class="arche"><span class="muted">${arc.lean ? "Leaning toward" : arc.touch ? "A touch of" : "Archetype"}</span><br><b>${esc(arc.a.label)}</b><p>${esc(arc.a.desc)}</p></div>` : ""}
    <p class="muted">Well, there's your tribute! Copy the line below and throw it into the Tribute builder (<i>Paste quiz result</i>, or the Bulk text view):</p>
    <div class="out"><code id="qLine">${esc(line)}</code><button id="qCopy">Copy</button></div>
    <div class="note" id="qNote"></div>
    <div class="actions"><button class="primary" id="qNext">Next victim</button><button class="ghost" id="qAgain">Retake</button></div>
    ${peopleHTML()}`;
  $("#qCopy").onclick = () => copy(line, "#qNote");
  $("#qNext").onclick = () => { st.name = ""; st.pronoun = ""; st.district = ""; intro(); };
  $("#qAgain").onclick = () => intro();
  bindPeople();
}

function peopleHTML() {
  return `<div class="people"><p class="muted">Here's everybody who's taken the quiz on this device (${saved.length}). You can copy the whole lot at once:</p>
    <textarea id="qAll" readonly>${esc(saved.map((r) => r.line).join("\n"))}</textarea>
    <div class="actions"><button id="qCopyAll">Copy all</button><button class="ghost" id="qClear">Clear list</button></div>
    <div class="note" id="qAllNote"></div></div>`;
}
function bindPeople() {
  if (!$("#qCopyAll")) return;
  $("#qCopyAll").onclick = () => copy(saved.map((r) => r.line).join("\n"), "#qAllNote");
  $("#qClear").onclick = () => { saved = []; try { localStorage.removeItem("hg-quiz-results"); } catch {} intro(); };
}
async function copy(text, note) {
  try { await navigator.clipboard.writeText(text); $(note).textContent = "Copied."; }
  catch { $(note).textContent = "Well, that didn't work. Select the text and copy it manually."; }
}

load().then(intro);
</script>
</body>
</html>
