<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunge Gaems: Who are you in the arena?</title>
<style>
  @font-face { font-family: "Gotham"; src: url("fonts/Gotham-Book.otf") format("opentype"); font-weight: 400; }
  @font-face { font-family: "Gotham"; src: url("fonts/Gotham-Medium.otf") format("opentype"); font-weight: 500; }
  @font-face { font-family: "Gotham"; src: url("fonts/Gotham-Bold.otf") format("opentype"); font-weight: 700; }
  :root { --bg: #0b0b0b; --text: #f2f2f2; --muted: #8f8f8f; --line: #2c2c2c; --gold: #e3c15b; --alt: #d46273;
          --sans: "Gotham", "Montserrat", "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 40px; }
  .brand { font: 700 18px/1 var(--sans); letter-spacing: .02em; }
  .brand span { color: var(--gold); margin-left: 5px; }
  .progress { color: var(--muted); font-size: 13px; }
  .bar { height: 3px; background: #222; margin: -28px 0 36px; }
  .bar i { display: block; height: 100%; background: var(--text); transition: width .25s; }
  h1 { font: 500 26px/1.25 var(--sans); margin: 0 0 12px; }
  h2 { font: 500 20px/1.35 var(--sans); margin: 0 0 24px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  input, select { font: 15px var(--sans); color: var(--text); background: #111; border: 1px solid #3a3a3a; padding: 9px 11px; border-radius: 0; }
  input:focus, select:focus { outline: none; border-color: var(--gold); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: 500 15px var(--sans); color: var(--text); background: transparent; border: 1px solid #3a3a3a; padding: 10px 18px; cursor: pointer; border-radius: 0; }
  button:hover { background: #1b1b1b; border-color: #555; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); border-color: var(--gold); color: #0b0b0b; font-weight: 700; }
  button.primary:hover { background: #ecd07a; }
  .answers { display: flex; flex-direction: column; gap: 8px; }
  .answers button { text-align: left; padding: 14px 16px; font-weight: 400; line-height: 1.4; }
  .answers button:hover { border-color: var(--text); }
  .nav { display: flex; justify-content: space-between; margin-top: 24px; }
  .ghost { border-color: transparent; color: var(--muted); padding-left: 0; }
  .ghost:hover { background: none; color: var(--text); border-color: transparent; }
  .traits { display: flex; flex-direction: column; gap: 14px; margin: 24px 0 28px; }
  .trait b { font-weight: 500; }
  .trait p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .arche { margin: 0 0 28px; }
  .arche b { color: var(--gold); font-weight: 500; }
  .arche p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .out { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .out code { flex: 1; font: 13px/1.5 var(--mono); background: #111; border: 1px solid #2a2a2a; padding: 10px 12px; overflow-x: auto; white-space: pre; }
  .people { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
  .people textarea { width: 100%; min-height: 90px; font: 13px/1.5 var(--mono); color: var(--text); background: #111; border: 1px solid #2a2a2a; padding: 10px 12px; resize: vertical; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.5em; }
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Hunge Gaems personality quiz. Data comes from the app (/api/quiz) or, in the
   standalone export, from the EMBED block below. Answers never name traits: each
   one quietly adds weight to several, and the result is 3-5 core traits as a
   roster line the Tribute builder reads directly. */
const EMBED = {"quiz": {"min_traits": 3, "max_traits": 5, "keep_ratio": 0.72, "kin_damp": 0.7, "kin": [["cautious", "pessimistic", "patient"], ["charismatic", "talkative", "showoff"], ["playful", "witty", "mischievous"], ["calm", "stoic", "easygoing"], ["strategic", "meticulous", "disciplined"], ["curious", "observant"], ["reckless", "impulsive"], ["compassionate", "empathetic", "forgiving"], ["proud", "self_assured", "competitive"], ["resourceful", "inventive", "pragmatic"], ["imaginative", "eccentric"], ["protective", "loyal"]], "questions": [{"q": "Your group is running low on supplies. You discover another tribute has a substantial stockpile.", "answers": [{"a": "Offer to negotiate a trade", "w": {"charismatic": 2, "diplomatic": 1, "empathetic": 1}}, {"a": "Take what you need while they're away", "w": {"opportunistic": 2, "ruthless": 1, "mischievous": 1}}, {"a": "Suggest pooling everyone's resources", "w": {"loyal": 1, "strategic": 1, "diplomatic": 1, "pragmatic": 1}}, {"a": "Leave and find another solution", "w": {"lone_wolf": 2, "resourceful": 1, "inventive": 1}}]}, {"q": "The gong sounds at the Cornucopia. What's your first move?", "answers": [{"a": "Sprint for the biggest bag", "w": {"competitive": 2, "fearless": 1, "ambitious": 1, "reckless": 1}}, {"a": "Grab the nearest small pack and vanish", "w": {"cautious": 2, "pragmatic": 1, "observant": 1}}, {"a": "Find someone to team up with, right there", "w": {"loyal": 1, "protective": 1, "talkative": 1}}, {"a": "Stand still, count the exits, watch who goes where", "w": {"observant": 2, "strategic": 1, "calm": 1, "patient": 1}}]}, {"q": "Your first night, alone in the dark. You...", "answers": [{"a": "Hum and talk to yourself to keep your spirits up", "w": {"playful": 1, "optimistic": 1, "talkative": 1, "eccentric": 1}}, {"a": "Lie awake listening to every sound", "w": {"pessimistic": 1, "superstitious": 1, "cautious": 1}}, {"a": "Sleep fine. Tomorrow's tomorrow", "w": {"easygoing": 2, "calm": 1, "stoic": 1}}, {"a": "Make a list of everything to do in the morning", "w": {"disciplined": 2, "meticulous": 1, "strategic": 1}}]}, {"q": "An ally makes a mistake that nearly gets you both killed.", "answers": [{"a": "Let it go. Everyone slips", "w": {"forgiving": 2, "easygoing": 1, "loyal": 1}}, {"a": "Say nothing. Remember it", "w": {"guarded": 1, "stubborn": 1, "patient": 1}}, {"a": "Tell them exactly what you think, loudly", "w": {"cantankerous": 2, "proud": 1, "self_assured": 1}}, {"a": "Turn it into a joke so nobody stays tense", "w": {"witty": 2, "playful": 1, "diplomatic": 1}}]}, {"q": "You find a strange glowing plant you've never seen before.", "answers": [{"a": "Touch it", "w": {"reckless": 2, "curious": 1, "impulsive": 1}}, {"a": "Study it carefully and remember where it is", "w": {"observant": 1, "meticulous": 1, "curious": 1}}, {"a": "Give it a ridiculous name", "w": {"eccentric": 1, "imaginative": 1, "playful": 1}}, {"a": "Avoid it. It's obviously a trap", "w": {"cautious": 1, "pessimistic": 1, "superstitious": 1}}]}, {"q": "A sponsor gift arrives. The note says to share it.", "answers": [{"a": "Share it, obviously", "w": {"compassionate": 2, "loyal": 1}}, {"a": "Share it, with conditions", "w": {"manipulative": 1, "strategic": 1, "opportunistic": 1}}, {"a": "Keep it. The note isn't the boss of you", "w": {"stubborn": 1, "self_assured": 1, "ruthless": 1, "proud": 1}}, {"a": "Give it to whoever needs it most, even a stranger", "w": {"empathetic": 1, "compassionate": 1, "sentimental": 1}}]}, {"q": "You realize a camera is pointed right at you.", "answers": [{"a": "Give them a show", "w": {"showoff": 2, "charismatic": 1}}, {"a": "Ignore it completely", "w": {"stoic": 1, "guarded": 1, "self_assured": 1}}, {"a": "Wink", "w": {"mischievous": 1, "witty": 1, "playful": 1}}, {"a": "Use it to win over sponsors", "w": {"ambitious": 2, "opportunistic": 1}}]}, {"q": "Your plan falls apart halfway through.", "answers": [{"a": "Improvise", "w": {"adaptable": 2, "inventive": 1, "impulsive": 1}}, {"a": "Go back to step one and do it properly", "w": {"disciplined": 1, "meticulous": 1, "stubborn": 1, "patient": 1}}, {"a": "Swear loudly, then fix it", "w": {"cantankerous": 1, "resilient": 1, "pragmatic": 1}}, {"a": "You never really had a plan", "w": {"easygoing": 1, "impulsive": 1, "restless": 1}}]}, {"q": "A tribute you don't know is hurt and calling for help.", "answers": [{"a": "Go to them right away", "w": {"protective": 2, "compassionate": 1, "fearless": 1}}, {"a": "Make sure it isn't a trap, then help", "w": {"cautious": 1, "empathetic": 1, "observant": 1}}, {"a": "Keep walking. You can't save everyone", "w": {"pragmatic": 2, "ruthless": 1}}, {"a": "Help them, and quietly hope they owe you", "w": {"opportunistic": 1, "manipulative": 1, "diplomatic": 1}}]}, {"q": "You have to wait in a hiding spot for hours.", "answers": [{"a": "Totally fine", "w": {"patient": 2, "calm": 1, "stoic": 1}}, {"a": "Agony. You need to move", "w": {"restless": 2, "impulsive": 1}}, {"a": "Daydream an entire novel", "w": {"imaginative": 2, "eccentric": 1}}, {"a": "Reorganize your gear three times", "w": {"meticulous": 1, "restless": 1, "disciplined": 1}}]}, {"q": "Another tribute challenges you to see who can climb higher.", "answers": [{"a": "You're already climbing", "w": {"competitive": 2, "reckless": 1, "showoff": 1}}, {"a": "Accept, after stretching properly", "w": {"competitive": 1, "disciplined": 1, "self_assured": 1}}, {"a": "Decline. It's pointless", "w": {"pragmatic": 1, "calm": 1}}, {"a": "Accept, and cheat", "w": {"mischievous": 2, "opportunistic": 1}}]}, {"q": "What do you carry for luck?", "answers": [{"a": "A token from home", "w": {"sentimental": 2, "superstitious": 1}}, {"a": "Luck is for people without plans", "w": {"strategic": 1, "self_assured": 1, "proud": 1}}, {"a": "Whatever interesting thing I find on the way", "w": {"resourceful": 1, "eccentric": 1, "curious": 1}}, {"a": "I'm the lucky charm", "w": {"optimistic": 1, "proud": 1, "showoff": 1}}]}, {"q": "Your alliance is arguing about the next move.", "answers": [{"a": "Calm everyone down and find a compromise", "w": {"diplomatic": 2, "calm": 1}}, {"a": "Make the decision for everyone", "w": {"ambitious": 1, "self_assured": 1, "proud": 1}}, {"a": "Quietly steer them toward your idea", "w": {"manipulative": 2, "strategic": 1}}, {"a": "Go do your own thing", "w": {"lone_wolf": 2, "stubborn": 1}}]}, {"q": "You haven't eaten in a day. You find a beehive.", "answers": [{"a": "Go for it. Stings are temporary", "w": {"fearless": 2, "reckless": 1, "resilient": 1}}, {"a": "Build a smoky fire first and do it right", "w": {"inventive": 1, "meticulous": 1, "resourceful": 1}}, {"a": "Watch where the bees go and look for an easier meal", "w": {"observant": 1, "patient": 1, "pragmatic": 1}}, {"a": "Leave it. Something else will turn up", "w": {"optimistic": 1, "easygoing": 1, "adaptable": 1}}]}, {"q": "The tribute who betrayed you two days ago is asleep right in front of you.", "answers": [{"a": "Let them sleep", "w": {"forgiving": 2, "compassionate": 1}}, {"a": "Take everything they have and leave", "w": {"opportunistic": 1, "ruthless": 1, "mischievous": 1}}, {"a": "End it", "w": {"ruthless": 2, "stoic": 1}}, {"a": "Wake them up and make them explain themselves", "w": {"proud": 1, "stubborn": 1, "cantankerous": 1}}]}, {"q": "Everything has gone wrong at once. You...", "answers": [{"a": "Keep going. You've had worse", "w": {"resilient": 2, "stubborn": 1}}, {"a": "Laugh, because what else is there", "w": {"witty": 1, "playful": 1, "optimistic": 1}}, {"a": "Honestly expected it", "w": {"pessimistic": 2, "stoic": 1}}, {"a": "Think of the people waiting for you at home", "w": {"sentimental": 2, "loyal": 1}}]}, {"q": "Somehow, you get a quiet afternoon in the arena.", "answers": [{"a": "Explore every corner", "w": {"curious": 2, "restless": 1}}, {"a": "Talk to anyone who'll listen", "w": {"talkative": 2, "charismatic": 1}}, {"a": "Sharpen, sort and prepare", "w": {"disciplined": 1, "pragmatic": 1, "strategic": 1}}, {"a": "Watch the clouds and make up stories about them", "w": {"imaginative": 1, "easygoing": 1, "superstitious": 1}}]}, {"q": "How would your friends describe you?", "answers": [{"a": "\"The one who keeps us together\"", "w": {"loyal": 1, "protective": 1, "diplomatic": 1}}, {"a": "\"Honestly, kind of a lot\"", "w": {"showoff": 1, "eccentric": 1, "talkative": 1}}, {"a": "\"Grumpy, but would die for us\"", "w": {"cantankerous": 1, "protective": 1, "guarded": 1}}, {"a": "\"Always up to something\"", "w": {"mischievous": 1, "inventive": 1, "curious": 1}}]}]}, "traits": {"charismatic": {"label": "Charismatic", "desc": "Naturally attracts people and builds connections.", "category": "Social personality"}, "lone_wolf": {"label": "Lone Wolf", "desc": "Prefers independence and operating alone.", "category": "Social personality"}, "loyal": {"label": "Loyal", "desc": "Values commitment and stands by their people.", "category": "Social personality"}, "manipulative": {"label": "Manipulative", "desc": "Uses persuasion, deception, and social leverage.", "category": "Social personality"}, "empathetic": {"label": "Empathetic", "desc": "Understands and responds to other people's needs.", "category": "Social personality"}, "guarded": {"label": "Guarded", "desc": "Slow to trust and reluctant to reveal vulnerability.", "category": "Social personality"}, "strategic": {"label": "Strategic", "desc": "Thinks ahead and considers consequences.", "category": "Decision-making"}, "impulsive": {"label": "Impulsive", "desc": "Acts on instinct rather than deliberation.", "category": "Decision-making"}, "opportunistic": {"label": "Opportunistic", "desc": "Recognizes and exploits advantageous situations.", "category": "Decision-making"}, "cautious": {"label": "Cautious", "desc": "Prefers predictable outcomes and minimizes unnecessary risks.", "category": "Decision-making"}, "curious": {"label": "Curious", "desc": "Seeks new experiences and information.", "category": "Decision-making"}, "adaptable": {"label": "Adaptable", "desc": "Adjusts quickly when plans fall apart.", "category": "Decision-making"}, "fearless": {"label": "Fearless", "desc": "Willingly confronts intimidating situations.", "category": "Conflict and survival"}, "resourceful": {"label": "Resourceful", "desc": "Makes effective use of whatever is available.", "category": "Conflict and survival"}, "ruthless": {"label": "Ruthless", "desc": "Willing to make difficult sacrifices to achieve an objective.", "category": "Conflict and survival"}, "protective": {"label": "Protective", "desc": "Takes responsibility for the safety of others.", "category": "Conflict and survival"}, "resilient": {"label": "Resilient", "desc": "Recovers quickly from setbacks.", "category": "Conflict and survival"}, "reckless": {"label": "Reckless", "desc": "Willingly takes risks others would avoid.", "category": "Conflict and survival"}, "optimistic": {"label": "Optimistic", "desc": "Expects favorable outcomes, even in difficult circumstances.", "category": "Personal disposition"}, "pessimistic": {"label": "Pessimistic", "desc": "Expects things to go wrong and prepares accordingly.", "category": "Personal disposition"}, "ambitious": {"label": "Ambitious", "desc": "Wants to accomplish something significant.", "category": "Personal disposition"}, "stubborn": {"label": "Stubborn", "desc": "Refuses to abandon convictions easily.", "category": "Personal disposition"}, "compassionate": {"label": "Compassionate", "desc": "Shows kindness, generosity, and concern.", "category": "Personal disposition"}, "proud": {"label": "Proud", "desc": "Values personal dignity and refuses to appear weak.", "category": "Personal disposition"}, "observant": {"label": "Observant", "desc": "Notices the little things others overlook. Pays attention to movement, patterns, and details that might become important later.", "category": "Decision-making"}, "patient": {"label": "Patient", "desc": "Knows that good things take time. Willing to wait for the right opportunity rather than force one.", "category": "Decision-making"}, "disciplined": {"label": "Disciplined", "desc": "Maintains routines and follows through on commitments. Doesn't let temporary feelings dictate every decision.", "category": "Decision-making"}, "meticulous": {"label": "Meticulous", "desc": "Pays attention to details and prefers to do things properly. Takes their time checking, sorting, and preparing.", "category": "Decision-making"}, "pragmatic": {"label": "Pragmatic", "desc": "Concerned with what works rather than what sounds good. Will accept an imperfect solution if it gets the job done.", "category": "Decision-making"}, "inventive": {"label": "Inventive", "desc": "Enjoys finding unusual solutions and making something useful out of unexpected materials.", "category": "Decision-making"}, "diplomatic": {"label": "Diplomatic", "desc": "Knows how to smooth over disagreements and find common ground without making everything personal.", "category": "Social personality"}, "forgiving": {"label": "Forgiving", "desc": "Believes people deserve another chance. Has a hard time holding onto anger, even when perhaps they should.", "category": "Social personality"}, "talkative": {"label": "Talkative", "desc": "Fills silence with conversation, stories, questions, and the occasional completely unnecessary observation.", "category": "Social personality"}, "sentimental": {"label": "Sentimental", "desc": "Gets attached to people, places, and little reminders of home. Finds meaning in things others might discard.", "category": "Social personality"}, "playful": {"label": "Playful", "desc": "Enjoys joking, teasing, and finding ways to have fun. Refuses to take every moment seriously.", "category": "Personal disposition"}, "witty": {"label": "Witty", "desc": "Has a quick sense of humor and a knack for finding the perfect thing to say, especially when nobody expects it.", "category": "Personal disposition"}, "eccentric": {"label": "Eccentric", "desc": "Sees the world a little differently. Has unusual interests, peculiar habits, and an impressive ability to surprise people.", "category": "Personal disposition"}, "imaginative": {"label": "Imaginative", "desc": "Has a vivid inner world and an endless supply of ideas, stories, and possibilities.", "category": "Personal disposition"}, "easygoing": {"label": "Easygoing", "desc": "Doesn't sweat the small stuff. Generally pleasant company and willing to roll with whatever happens.", "category": "Personal disposition"}, "cantankerous": {"label": "Cantankerous", "desc": "Complains about nearly everything and isn't particularly interested in being agreeable. Has a soft spot they would prefer nobody discover.", "category": "Personal disposition"}, "stoic": {"label": "Stoic", "desc": "Keeps their emotions close and rarely lets others see them struggle. Endures discomfort without much complaint.", "category": "Personal disposition"}, "calm": {"label": "Calm", "desc": "Usually keeps a level head. Doesn't panic easily and can bring a little steadiness to chaotic situations.", "category": "Personal disposition"}, "competitive": {"label": "Competitive", "desc": "Hates losing and loves proving themselves. Even a minor challenge can become a personal contest.", "category": "Personal disposition"}, "showoff": {"label": "Showoff", "desc": "Enjoys an audience and likes making an impression. Would rather do something spectacular than quietly get the job done.", "category": "Social personality"}, "mischievous": {"label": "Mischievous", "desc": "Enjoys harmless trouble, clever tricks, and occasionally making someone else's day more interesting.", "category": "Social personality"}, "superstitious": {"label": "Superstitious", "desc": "Believes in signs, omens, lucky objects, and little rituals. Would rather not tempt fate by ignoring them.", "category": "Personal disposition"}, "restless": {"label": "Restless", "desc": "Struggles to sit still for long. Always feels like there is somewhere else to be or something else to discover.", "category": "Personal disposition"}, "self_assured": {"label": "Self-Assured", "desc": "Trusts their own judgment and is comfortable with who they are. Doesn't need constant approval from others.", "category": "Personal disposition"}}, "archetypes": {"benevolent_manipulator": {"label": "The Benevolent Manipulator", "desc": "Cares about people but knows exactly how to influence them. Could become a beloved leader or a dangerous social operator.", "traits": ["empathetic", "manipulative", "strategic"]}, "cowardly_hero": {"label": "The Cowardly Hero", "desc": "Terrified of danger but consistently puts themselves in harm's way for people they love.", "traits": ["protective", "cautious", "loyal"]}, "charming_opportunist": {"label": "The Charming Opportunist", "desc": "Makes friends easily, but always has an eye on what those friendships can accomplish.", "traits": ["charismatic", "opportunistic", "ambitious"]}, "principled_survivor": {"label": "The Principled Survivor", "desc": "Refuses to give up or compromise their values, even when doing so would make survival easier.", "traits": ["resilient", "stubborn", "compassionate"]}, "smiling_executioner": {"label": "The Smiling Executioner", "desc": "Genuinely delightful company. Will wave goodbye before doing something unforgivable, and mean the wave.", "traits": ["optimistic", "ruthless", "charismatic"]}, "reluctant_warlord": {"label": "The Reluctant Warlord", "desc": "Wants to win everything and risk nothing. Has a seven-step plan and is nervous about step one.", "traits": ["cautious", "ambitious", "strategic"]}, "loyal_peacock": {"label": "The Loyal Peacock", "desc": "Vain, loud and absolutely devoted. Will die for you, but will need you to notice how good they looked doing it.", "traits": ["proud", "loyal", "charismatic"]}, "doomsday_prepper": {"label": "The Doomsday Prepper", "desc": "Has been ready for the worst since before the worst was invented. Owns three backup plans and a spare rock.", "traits": ["pessimistic", "resourceful", "cautious"]}, "golden_retriever": {"label": "The Golden Retriever", "desc": "Runs headfirst into everything, tail wagging. Trusts too fast, forgives faster, and somehow it mostly works.", "traits": ["optimistic", "loyal", "impulsive"]}, "lighthouse_keeper": {"label": "The Lighthouse Keeper", "desc": "Keeps everyone at a distance and an eye on all of them anyway. Shows up exactly when needed, then vanishes.", "traits": ["lone_wolf", "protective", "guarded"]}, "chaos_gremlin": {"label": "The Chaos Gremlin", "desc": "Pokes the thing. Eats the berry. Opens the hatch. Somehow still alive, which surprises everyone, including them.", "traits": ["impulsive", "curious", "reckless"]}, "velvet_knife": {"label": "The Velvet Knife", "desc": "Warm voice, soft hands, sharp plans. You'll like them right up until you don't exist anymore.", "traits": ["charismatic", "manipulative", "ruthless"]}, "accidental_saint": {"label": "The Accidental Saint", "desc": "Goes out to steal something and comes back having saved a life. Keeps meaning to be selfish. Keeps failing.", "traits": ["opportunistic", "compassionate", "impulsive"]}, "iron_grandma": {"label": "The Iron Grandma", "desc": "Will feed you, scold you and outlive everyone who threatens you. Has opinions about your posture.", "traits": ["resilient", "protective", "stubborn"]}, "raccoon_monarch": {"label": "The Raccoon Monarch", "desc": "Collects shiny things, opens every container, and has a use for all of it. Their pack is a small kingdom.", "traits": ["resourceful", "opportunistic", "curious"]}, "brooding_poet": {"label": "The Brooding Poet", "desc": "Feels everything, expects the worst, and would like to be left alone with it. Writes eulogies in their head.", "traits": ["pessimistic", "empathetic", "lone_wolf"]}, "cockroach": {"label": "The Cockroach", "desc": "Not glamorous. Not fast. Not going to die, apparently. Outlasts the dramatic ones through sheer boring competence.", "traits": ["resilient", "adaptable", "cautious"]}, "kamikaze_optimist": {"label": "The Kamikaze Optimist", "desc": "Sincerely believes it'll work out. Jumps first. Has, against all reason, a decent track record.", "traits": ["optimistic", "reckless", "fearless"]}, "chessmaster_in_rags": {"label": "The Chessmaster in Rags", "desc": "Looks like nobody. Is thinking eight moves ahead with two sticks and a piece of string.", "traits": ["strategic", "resourceful", "guarded"]}, "mother_hen": {"label": "The Mother Hen", "desc": "Adopts everyone within ten feet. Has bandaged three enemies and asked whether they'd eaten.", "traits": ["protective", "compassionate", "empathetic"]}, "sore_winner": {"label": "The Sore Winner", "desc": "Wins graciously in public and replays it gloatingly in private. Losing is not an option they recognize.", "traits": ["proud", "ambitious", "stubborn"]}, "gentle_butcher": {"label": "The Gentle Butcher", "desc": "Understands exactly how you feel. Does it anyway. Apologizes sincerely.", "traits": ["empathetic", "ruthless"]}, "lovable_disaster": {"label": "The Lovable Disaster", "desc": "Everything they touch catches fire, and everyone still wants to be on their team.", "traits": ["charismatic", "reckless"]}, "professional_worrier": {"label": "The Professional Worrier", "desc": "Has worried about this exact situation since childhood. Finds it almost validating.", "traits": ["pessimistic", "cautious"]}, "feral_philosopher": {"label": "The Feral Philosopher", "desc": "Wanders alone asking big questions of small animals. Occasionally gets answers.", "traits": ["lone_wolf", "curious"]}, "cheerful_pessimist": {"label": "The Cheerful Pessimist", "desc": "Absolutely sure it'll all go wrong, and weirdly upbeat about it. Doom with a smile.", "traits": ["optimistic", "pessimistic"]}, "gossip": {"label": "The Gossip", "desc": "Knows who's allied with whom, who's limping and who cried last night. Shares it freely.", "traits": ["charismatic", " let D = null;                      // { quiz, traits, archetypes }
const st = { name: "", pronoun: "", district: "", i: 0, picks: [], order: [] };
let saved = [];
try { saved = JSON.parse(localStorage.getItem("hg-quiz-results") || "[]"); } catch { saved = []; }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PRON = { he: "he/him", she: "she/her", they: "they/them" };

async function load() {
  if (EMBED) { D = EMBED; return; }
  try { D = await (await fetch("/api/quiz")).json(); }
  catch { $("#app").innerHTML = `<p>Couldn't load the quiz. Open it from the running app at <code>/quiz.html</code>.</p>`; throw new Error("no data"); }
}

function shuffled(n, salt) {           // vary answer order so position doesn't hint at anything
  const a = [...Array(n).keys()];
  let s = 0; for (const ch of salt) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = n - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function intro() {
  $("#app").innerHTML = `
    <header><div class="brand">HUNGE<span>GAEMS</span></div></header>
    <h1>Who are you in the arena?</h1>
    <p class="muted">${D.quiz.questions.length} quick situations. Answer the way you actually would, not the way you'd like to. There are no right answers, only revealing ones.</p>
    <label>Your name <input id="qName" value="${esc(st.name)}" autocomplete="off"></label>
    <div class="row">
      <label>Pronouns <select id="qPron"><option value="">prefer not to say</option>${Object.entries(PRON).map(([k, v]) => `<option value="${k}" ${st.pronoun === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>District (optional) <input id="qDist" type="number" min="1" max="24" value="${esc(st.district)}"></label>
    </div>
    <button class="primary" id="qStart">Begin</button>
    ${saved.length ? peopleHTML() : ""}`;
  $("#qStart").onclick = () => {
    st.name = $("#qName").value.trim();
    if (!st.name) { $("#qName").focus(); return; }
    st.pronoun = $("#qPron").value; st.district = $("#qDist").value.trim();
    st.i = 0; st.picks = [];
    st.order = D.quiz.questions.map((q, i) => shuffled(q.answers.length, st.name + i));
    question();
  };
  bindPeople();
}

function question() {
  const q = D.quiz.questions[st.i], n = D.quiz.questions.length;
  $("#app").innerHTML = `
    <header><div class="brand">HUNGE<span>GAEMS</span></div><div class="progress">${st.i + 1} of ${n}</div></header>
    <div class="bar"><i style="width:${(st.i / n) * 100}%"></i></div>
    <h2>${esc(q.q)}</h2>
    <div class="answers">${st.order[st.i].map((k) => `<button data-a="${k}">${esc(q.answers[k].a)}</button>`).join("")}</div>
    <div class="nav"><button class="ghost" id="qBack">${st.i ? "Back" : "Start over"}</button></div>`;
  document.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
    st.picks[st.i] = +b.dataset.a;
    if (++st.i < n) question(); else result();
  }));
  $("#qBack").onclick = () => { if (st.i) { st.i--; question(); } else intro(); };
}

function score() {
  const Q = D.quiz, raw = {}, pot = {};
  Q.questions.forEach((q, i) => {
    const best = {};
    q.answers.forEach((a) => Object.entries(a.w).forEach(([t, w]) => (best[t] = Math.max(best[t] || 0, w))));
    Object.entries(best).forEach(([t, w]) => (pot[t] = (pot[t] || 0) + w));
    const a = q.answers[st.picks[i]];
    if (a) Object.entries(a.w).forEach(([t, w]) => (raw[t] = (raw[t] || 0) + w));
  });
  const s = {};
  Object.keys(raw).forEach((t) => { if (D.traits[t]) s[t] = raw[t] / Math.sqrt(pot[t]); });
  const kinOf = {};
  (Q.kin || []).forEach((g) => g.forEach((t) => (kinOf[t] = g)));
  const chosen = [];
  let top = null;
  while (chosen.length < Q.max_traits) {
    const left = Object.keys(s).filter((t) => !chosen.includes(t));
    if (!left.length) break;
    left.sort((a, b) => s[b] - s[a] || a.localeCompare(b));
    const t = left[0];
    if (top === null) top = s[t];
    if (chosen.length >= Q.min_traits && s[t] < Q.keep_ratio * top) break;
    chosen.push(t);
    (kinOf[t] || []).forEach((k) => { if (k !== t && s[k] !== undefined) s[k] *= Q.kin_damp; });
  }
  return chosen;
}

function archetypeFor(traits) {        // same rules as the game, for one person
  const have = new Set(traits), keys = Object.keys(D.archetypes);
  const rank = (a, b) => (D.archetypes[b].traits.length - D.archetypes[a].traits.length) || (keys.indexOf(a) - keys.indexOf(b));
  const exact = keys.filter((k) => D.archetypes[k].traits.every((t) => have.has(t))).sort(rank);
  if (exact.length) return { a: D.archetypes[exact[0]], lean: false };
  const lean = keys.filter((k) => { const n = D.archetypes[k].traits; return n.length >= 3 && n.filter((t) => have.has(t)).length === n.length - 1; }).sort(rank);
  if (lean.length) return { a: D.archetypes[lean[0]], lean: true };
  const first = (k) => Math.min(...D.archetypes[k].traits.filter((t) => have.has(t)).map((t) => traits.indexOf(t)));
  const touch = keys.filter((k) => D.archetypes[k].traits.some((t) => have.has(t)))
    .sort((a, b) => first(a) - first(b) || D.archetypes[a].traits.length - D.archetypes[b].traits.length || keys.indexOf(a) - keys.indexOf(b));
  return touch.length ? { a: D.archetypes[touch[0]], touch: true } : null;
}

function rosterLine(traits) {
  const cols = [st.name, st.district || "", PRON[st.pronoun] || "", "", traits.map((t) => D.traits[t].label).join(", ")];
  return cols.join(" | ");
}

function result() {
  const traits = score(), arc = archetypeFor(traits), line = rosterLine(traits);
  saved = saved.filter((r) => r.name.toLowerCase() !== st.name.toLowerCase()).concat([{ name: st.name, line }]);
  try { localStorage.setItem("hg-quiz-results", JSON.stringify(saved)); } catch { /* private mode */ }
  $("#app").innerHTML = `
    <header><div class="brand">HUNGE<span>GAEMS</span></div><div class="progress">Done</div></header>
    <h1>${esc(st.name)}, in the arena</h1>
    <div class="traits">${traits.map((t) => `<div class="trait"><b>${esc(D.traits[t].label)}</b><p>${esc(D.traits[t].desc)}</p></div>`).join("")}</div>
    ${arc ? `<div class="arche"><span class="muted">${arc.lean ? "Leaning toward" : arc.touch ? "A touch of" : "Archetype"}</span><br><b>${esc(arc.a.label)}</b><p>${esc(arc.a.desc)}</p></div>` : ""}
    <p class="muted">Paste this into the Tribute builder (<i>Paste quiz result</i>, or the Bulk text view):</p>
    <div class="out"><code id="qLine">${esc(line)}</code><button id="qCopy">Copy</button></div>
    <div class="note" id="qNote"></div>
    <div class="actions"><button class="primary" id="qNext">Next person</button><button class="ghost" id="qAgain">Retake</button></div>
    ${peopleHTML()}`;
  $("#qCopy").onclick = () => copy(line, "#qNote");
  $("#qNext").onclick = () => { st.name = ""; st.pronoun = ""; st.district = ""; intro(); };
  $("#qAgain").onclick = () => intro();
  bindPeople();
}

function peopleHTML() {
  return `<div class="people"><p class="muted">Everyone who's taken it on this device (${saved.length}). Copy them all at once:</p>
    <textarea id="qAll" readonly>${esc(saved.map((r) => r.line).join("\n"))}</textarea>
    <div class="actions"><button id="qCopyAll">Copy all</button><button class="ghost" id="qClear">Clear list</button></div>
    <div class="note" id="qAllNote"></div></div>`;
}
function bindPeople() {
  if (!$("#qCopyAll")) return;
  $("#qCopyAll").onclick = () => copy(saved.map((r) => r.line).join("\n"), "#qAllNote");
  $("#qClear").onclick = () => { saved = []; try { localStorage.removeItem("hg-quiz-results"); } catch {} intro(); };
}
async function copy(text, note) {
  try { await navigator.clipboard.writeText(text); $(note).textContent = "Copied."; }
  catch { $(note).textContent = "Couldn't copy automatically. Select the text and copy it."; }
}

load().then(intro);
</script>
</body>
</html>
